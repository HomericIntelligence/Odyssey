# .github/workflows/dependabot-uv-lock.yml
# Generate uv.lock and pip-only exports for same-repository Dependabot PRs.
#
# SECURITY BOUNDARY: pull-request code executes only in this read-only
# producer. It can publish untrusted bytes as an artifact, but it cannot update
# a branch or dispatch another workflow. The default-branch-only
# dependabot-uv-lock-writer.yml workflow validates those bytes before writing.
name: Regenerate dependency files on Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate-uv-lock:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Regenerate uv.lock deterministically
        # Plain `uv lock` preserves unrelated locked versions. `--upgrade` is
        # intentionally absent so one Dependabot bump cannot refresh the world.
        run: uv lock

      - name: Synchronize locked environment
        run: uv sync --locked

      - name: Regenerate requirements exports
        run: python scripts/sync_requirements.py --repo-root .

      - name: Verify generated dependency files
        env:
          DEPENDENCY_SNAPSHOT: ${{ runner.temp }}/dependabot-dependency-snapshot.json
        run: |
          uv lock --check
          python scripts/sync_requirements.py --check --repo-root .
          python scripts/ci/commit_generated_dependencies.py snapshot \
            --repo-root . \
            --snapshot-path "$DEPENDENCY_SNAPSHOT"

      - name: Detect generated dependency changes
        id: detect-regen
        run: |
          if git diff --quiet -- uv.lock requirements.txt requirements-dev.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package exact untrusted result artifact
        if: always()
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/dependabot-generated-dependencies
          DEPENDENCY_SNAPSHOT: ${{ runner.temp }}/dependabot-dependency-snapshot.json
          DEPS_CHANGED: ${{ steps.detect-regen.outputs.changed || 'false' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCER_STATUS: ${{ job.status }}
          TARGET_REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: >-
          python scripts/ci/commit_generated_dependencies.py package
          --repo-root .
          --artifact-root "$ARTIFACT_ROOT"
          --snapshot-path "$DEPENDENCY_SNAPSHOT"

      - name: Upload exact dependency result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dependabot-generated-dependencies
          path: ${{ runner.temp }}/dependabot-generated-dependencies
          if-no-files-found: error
          retention-days: 1
