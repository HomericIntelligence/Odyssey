name: Set Up Podman Container
description: Build and start the Podman compose development container for CI.

runs:
  using: composite
  steps:
    - name: Ensure .gitconfig exists
      shell: bash
      run: touch "$HOME/.gitconfig"

    - name: Export runner UID/GID
      id: uid
      shell: bash
      run: |
        echo "USER_ID=$(id -u)" >> "$GITHUB_ENV"
        echo "GROUP_ID=$(id -g)" >> "$GITHUB_ENV"
        echo "INSTALL_CLAUDE_CODE=false" >> "$GITHUB_ENV"
        echo "user_id=$(id -u)" >> "$GITHUB_OUTPUT"

    - name: Select compatible Podman runtime
      shell: bash
      run: bash scripts/ci/ensure-podman-runtime.sh

    - name: Cache container image tar
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5
      with:
        path: /tmp/podman-image-cache
        # UID is included so a cached image built with USER_ID=1000 is never
        # reused on a runner where id -u returns 1001.  Mismatched UID causes
        # /home/dev to be unwritable inside the container.
        key: container-image-uid${{ steps.uid.outputs.user_id }}-${{ hashFiles('Dockerfile', 'pyproject.toml', 'uv.lock') }}

    - name: Start Podman socket
      shell: bash
      run: |
        socket_path="/run/user/$(id -u)/podman/podman.sock"
        socket_uri="unix://$socket_path"
        service_log="${RUNNER_TEMP:-/tmp}/odyssey-podman-service.log"

        if ! curl --silent --fail --unix-socket "$socket_path" http://localhost/_ping >/dev/null 2>&1; then
          if command -v systemctl >/dev/null 2>&1 \
             && systemctl --user start podman.socket; then
            echo "Started podman.socket with systemd"
          else
            mkdir -p "$(dirname "$socket_path")"
            podman system service --time=0 "$socket_uri" >"$service_log" 2>&1 &
            echo "Started standalone Podman service (pid $!)"
          fi
        fi

        socket_ready=false
        for check in $(seq 1 30); do
          if curl --silent --fail --unix-socket "$socket_path" http://localhost/_ping >/dev/null; then
            socket_ready=true
            break
          fi
          echo "Waiting for Podman socket readiness ($check/30)"
          sleep 1
        done

        if [[ "$socket_ready" != true ]]; then
          echo "ERROR: Podman socket did not become ready at $socket_path" >&2
          if [[ -f "$service_log" ]]; then
            cat "$service_log" >&2
          fi
          exit 1
        fi

        export DOCKER_HOST="$socket_uri"
        echo "DOCKER_HOST=$socket_uri" >> "$GITHUB_ENV"

    - name: Load cached image or build
      shell: bash
      run: |
        if [ -f /tmp/podman-image-cache/dev.tar ]; then
          echo "Loading cached image..."
          podman load -i /tmp/podman-image-cache/dev.tar
        else
          echo "No cache found, building image..."
          podman compose build odyssey-dev
          mkdir -p /tmp/podman-image-cache
          podman save -o /tmp/podman-image-cache/dev.tar odyssey:dev
        fi

    # NOTE (ADR-018): the former "Seed pixi-cache volume" step is gone. The
    # uv-managed venv (incl. the Mojo compiler) is baked into the image at
    # /home/dev/.venv ($UV_PROJECT_ENVIRONMENT) and is NOT shadowed by any
    # runtime volume mount, so the entrypoint's `uv sync` check finds mojo
    # already present with no per-run seeding. The `uv-cache` volume only holds
    # the download cache and may start empty without any correctness impact.

    - name: Smoke test built image
      shell: bash
      run: podman run --rm --entrypoint /bin/true odyssey:dev

    - name: Start container
      shell: bash
      run: podman compose up -d odyssey-dev

    - name: Wait for container and verify
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if podman compose ps -q odyssey-dev 2>/dev/null \
            | xargs -r podman inspect -f '{{.State.Running}}' 2>/dev/null \
            | grep -q true; then
            echo "Container is running"
            podman compose exec -T odyssey-dev bash -c '
              set -euo pipefail
              probe=$(mktemp -d /workspace/.odyssey-write-probe.XXXXXX)
              rmdir "$probe"
              mojo --version
            '
            exit 0
          fi
          echo "Waiting for container... ($i/30)"
          sleep 2
        done
        echo "ERROR: Container did not start within 60 seconds"
        podman compose logs odyssey-dev
        exit 1
